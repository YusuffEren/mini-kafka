version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt

linters-settings:
  errcheck:
    check-blank: false

run:
  timeout: 5m

issues:
  exclude-rules:
    - path: internal/storage/index_test.go
      linters:
        - errcheck
    - path: internal/storage/index_windows.go
      text: "SA1019"
