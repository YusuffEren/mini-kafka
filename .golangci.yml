version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
  settings:
    errcheck:
      check-blank: false

formatters:
  enable:
    - gofmt

run:
  timeout: 5m

issues:
  exclusions:
    rules:
      - path: internal/storage/index_test.go
        linters:
          - errcheck
      - path: internal/storage/index_windows.go
        text: "SA1019"
      - path: internal/protocol/codec_test.go
        linters:
          - gofmt
